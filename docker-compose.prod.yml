services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      API_URL_BASE: ${API_URL_BASE:?Define API_URL_BASE in .env}
      MYSQL_HOST: ${MYSQL_HOST:?Define MYSQL_HOST in .env}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER_DB: ${MYSQL_USER_DB:?Define MYSQL_USER_DB in .env}
      MYSQL_PASSWORD_DB: ${MYSQL_PASSWORD_DB:?Define MYSQL_PASSWORD_DB in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE in .env}
      MONGO_URI: ${MONGO_URI:?Define MONGO_URI in .env}
      MONGO_DB: ${MONGO_DB:?Define MONGO_DB in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-240}
    restart: unless-stopped
